<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TV Show Project | Pinky (Pinx-pinx)</title>
    <link href="style.css" rel="stylesheet" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  </head>

  <body>
    <header>
      <!-- Show selector -->
      <select id="showSelect">
        <option value="">Select a show...</option>
      </select>

      <!-- Search episodes -->
      <input type="text" id="searchInput" placeholder="Search episodes..." />

      <!-- Episode selector -->
      <select id="episodeSelect">
        <option value="">Jump to episode...</option>
      </select>

      <!-- Sort shows -->
      <select id="sortSelect">
        <option value="">Sort shows...</option>
        <option value="name">A-Z</option>
        <option value="rating">Highest Rating</option>
      </select>

      <!-- Episode count -->
      <p id="episodeCount"></p>
    </header>

    <!-- Search shows -->
    <input
      type="text"
      id="showSearch"
      placeholder="Search shows..."
      style="
        display: none;
        margin: 10px 20px;
        width: calc(100% - 40px);
        padding: 8px;
        font-size: 14px;
      "
    />

    <!-- Shows container -->
    <div id="showsContainer"></div>

    <!-- Episodes container -->
    <div id="root"></div>

    <!-- Back button -->
    <button id="backToShows" style="display: none; margin: 16px">
      Back to Shows
    </button>

    <!---->
    Loading Spinner -->
    <div id="loadingSpinner" style="display: none">
      <p>Loading data...</p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
